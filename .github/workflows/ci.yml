name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Gradle 빌드 액션 (캐싱 포함)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 상세 로그(--info)를 추가하여 빌드 실행
      - name: Build with Gradle
        run: ./gradlew test bootJar --no-daemon --info --stacktrace